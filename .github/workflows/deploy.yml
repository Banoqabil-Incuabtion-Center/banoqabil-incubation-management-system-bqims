name: Deploy Admin Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & Build
        run: |
          npm install
          echo "VITE_API_URL=https://api.banoqabil.online" > .env.production
          echo "VITE_SOCKET_URL=https://api.banoqabil.online" >> .env.production
          npm run build

      - name: Deploy built static files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "dist/*"
          target: "/var/www/banoqabil-ims/admin-frontend"
          strip_components: 1
